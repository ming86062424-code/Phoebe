<text class="ct" x="289" y="769.5">minio</text>
<text class="cs" x="289" y="787.5">資料檔</text>
<polyline class="e" points="177,712 177,740"/>
<polyline class="e" points="352,712 352,740"/>
<rect class="g g-teal" x="470" y="612" width="390" height="213" rx="12" stroke-dasharray="6 4"/>
<text class="gl t-teal" x="484" y="634">共用儲存 · web 與 ingest 掛同一個 volume</text>
<rect class="card" x="490" y="642" width="350" height="52" rx="8"/>
<use href="#i-db" class="ic-teal" x="504" y="653.0" width="30" height="30"/>
