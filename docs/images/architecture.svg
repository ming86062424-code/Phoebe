.ct{fill:#e6edf3}
.cs{fill:#9198a1}
.e{stroke:#8b949e}
.ah{fill:#8b949e}
.lbg{fill:#0d1117}
.el{fill:#c9d1d9}
.foot{fill:#9198a1}
.g-blue{stroke:#6d9eff;fill:#16223a} .t-blue{fill:#6d9eff} .ic-blue{color:#6d9eff}
.g-orange{stroke:#f0a050;fill:#33240f} .t-orange{fill:#f0a050} .ic-orange{color:#f0a050}
.g-purple{stroke:#ad8cf0;fill:#271d3b} .t-purple{fill:#ad8cf0} .ic-purple{color:#ad8cf0}
.g-green{stroke:#5cc47c;fill:#142b1c} .t-green{fill:#5cc47c} .ic-green{color:#5cc47c}
