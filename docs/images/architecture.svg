<rect class="card" x="970" y="280" width="190" height="62" rx="8"/>
<use href="#i-pc" class="ic-gray" x="984" y="296.0" width="30" height="30"/>
<text class="ct" x="1026" y="307.5">Ollama</text>
<text class="cs" x="1026" y="325.5">主機上的聊天模型</text>
<rect class="card" x="970" y="428" width="190" height="64" rx="8"/>
<use href="#i-term" class="ic-gray" x="984" y="445.0" width="30" height="30"/>
<text class="ct" x="1026" y="456.5">Docker socket</text>
<text class="cs" x="1026" y="474.5">nvidia-smi</text>
<polyline class="e" points="685,90 685,203" marker-end="url(#arrow)"/>
<rect class="lbg" x="646.2" y="150" width="77.6" height="17" rx="3"/>
