<polyline class="e" points="860,290 968,310" marker-end="url(#arrow)"/>
<polyline class="e" points="860,460 968,460" marker-end="url(#arrow)"/>
<rect class="lbg" x="886.0" y="441" width="56.0" height="17" rx="3"/>
<text class="el" x="914" y="453" text-anchor="middle">讀取用量</text>
<polyline class="e" points="260,305 260,413" marker-end="url(#arrow)"/>
<rect class="lbg" x="226.0" y="342" width="68.0" height="17" rx="3"/>
