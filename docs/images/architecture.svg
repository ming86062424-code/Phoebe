<text class="cs" x="566" y="252.5">Gunicorn 2 個 worker + FastAPI</text>
<text class="cs" x="566" y="269.5">網頁介面（React）與所有 API</text>
<text class="cs" x="566" y="286.5">檢索、組提示詞、串流回答</text>
