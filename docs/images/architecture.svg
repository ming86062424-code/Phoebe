.g-blue{stroke:#3b6fd4;fill:#eef3fd} .t-blue{fill:#3b6fd4} .ic-blue{color:#3b6fd4}
.g-orange{stroke:#c96a12;fill:#fdf3e8} .t-orange{fill:#c96a12} .ic-orange{color:#c96a12}
.g-purple{stroke:#7b52c7;fill:#f4effc} .t-purple{fill:#7b52c7} .ic-purple{color:#7b52c7}
