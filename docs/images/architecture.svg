<text class="cs" x="136" y="252.5">解析文件 → 產生向量 → 寫入 Milvus</text>
<text class="cs" x="136" y="269.5">每 2 秒查一次文件佇列</text>
<text class="cs" x="136" y="286.5">LiteParse 在這裡執行</text>
<rect class="g g-blue" x="490" y="170" width="390" height="150" rx="12" stroke-dasharray="6 4"/>
