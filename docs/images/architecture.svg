<polyline class="e" points="410,305 410,413" marker-end="url(#arrow)"/>
<rect class="lbg" x="367.1" y="342" width="85.8" height="17" rx="3"/>
<text class="el" x="410" y="354" text-anchor="middle">chunk 轉向量</text>
<polyline class="e" points="560,305 560,413" marker-end="url(#arrow)"/>
<rect class="lbg" x="526.0" y="342" width="68.0" height="17" rx="3"/>
<text class="el" x="560" y="354" text-anchor="middle">問題轉向量</text>
<polyline class="e" points="95,305 95,578" marker-end="url(#arrow)"/>
<rect class="lbg" x="99.0" y="544" width="157.8" height="17" rx="3"/>
