<text class="cs" x="546" y="682.5">帳號、對話、知識庫、文件佇列</text>
<rect class="card" x="490" y="702" width="350" height="52" rx="8"/>
<use href="#i-db" class="ic-teal" x="504" y="713.0" width="30" height="30"/>
<text class="ct" x="546" y="724.5">monitor.db（SQLite）</text>
<text class="cs" x="546" y="742.5">事件與資源取樣</text>
<rect class="card" x="490" y="762" width="350" height="52" rx="8"/>
<use href="#i-folder" class="ic-teal" x="504" y="773.0" width="30" height="30"/>
