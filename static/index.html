<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ollama 聊天</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <button id="new-chat">新對話</button>
      <ul id="conv-list" class="conv-list"></ul>
      <div id="user-name"></div>
      <button id="logout">登出</button>
    </aside>
    <main class="main">
      <div id="messages" class="messages"></div>
      <form id="composer" class="composer">
        <textarea id="input" rows="2" placeholder="輸入訊息（Enter 送出，Shift+Enter 換行）"></textarea>
        <button id="send" type="submit">送出</button>
      </form>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
