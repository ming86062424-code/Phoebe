# 在 docker/ 目錄執行（先 cp .env.example .env）：
#   cd docker && docker compose up -d --build
# docker/.env 同時用於變數插值與容器環境變數；build context 為上一層（專案根目錄）。
name: phoebe

x-env: &env
  env_file:
    - path: .env
      required: false

services:
  chroma:
    image: chromadb/chroma:1.5.9
    restart: unless-stopped
    # chroma 1.x 預設持久化路徑為 /data，不需 0.x 的 IS_PERSISTENT/PERSIST_DIRECTORY
    volumes:
      - chroma-data:/data
    healthcheck:
      # ⚠️ 未在 chroma 1.5.9 映像內驗證；以 bash /dev/tcp 檢查連接埠（映像無 curl）
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    <<: *env
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: web
    image: phoebe-web:local
    restart: unless-stopped
    depends_on:
      chroma:
        condition: service_healthy
    stop_grace_period: 30s
    ports:
      - "${PHOEBE_PORT:-8000}:8000"
    environment:
      KB_WORKER_MODE: external
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      DB_PATH: /data/app.db
      KB_DIR: /data/kb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - phoebe-data:/data
    healthcheck:
      # /api/me 未登入回 401 也代表服務正常
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.error, urllib.request
          try:
              urllib.request.urlopen("http://127.0.0.1:8000/api/me", timeout=3)
          except urllib.error.HTTPError as e:
              sys.exit(0 if e.code == 401 else 1)
          except Exception:
              sys.exit(1)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *env
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: worker
    image: phoebe-worker:local
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    stop_grace_period: 30s
    environment:
      VLLM_BASE_URL: http://vllm:8000/v1
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      DB_PATH: /data/app.db
      KB_DIR: /data/kb
      HF_HOME: /hf-cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - phoebe-data:/data
      - hf-cache:/hf-cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # 選用：docker compose --profile vllm up -d，並在 docker/.env 設 OCR_BACKEND=vllm
  # （worker 的 VLLM_BASE_URL 由本檔固定指向此服務）
  vllm:
    <<: *env
    profiles: [vllm]
    image: vllm/vllm-openai:v0.11.2
    restart: unless-stopped
    ports:
      - "8001:8000"
    command:
      - --model
      - ${OCR_MODEL:-lightonai/LightOnOCR-3-0.8B}
      - --dtype
      - float16
      - --gpu-memory-utilization
      - ${VLLM_GPU_UTIL:-0.35}
      - --max-model-len
      - "8192"
    ipc: host
    environment:
      HF_HOME: /hf-cache
    volumes:
      - hf-cache:/hf-cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  phoebe-data:
  chroma-data:
  hf-cache:
