# 在 docker/ 目錄執行（先 cp .env.example .env）：
#   cd docker && docker compose up -d --build
# docker/.env 同時用於變數插值與容器環境變數；build context 為上一層（專案根目錄）。
name: phoebe

x-env: &env
  env_file:
    - path: .env
      required: false

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ./volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  # 向量資料庫（Milvus standalone，沿用官方 v2.6.25 compose 的 etcd／minio 設定）。
  # 只對本機 127.0.0.1:19530 開放（無驗證）；本機快速測試：docker compose up -d milvus
  milvus:
    image: milvusdb/milvus:v2.6.25
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    ports:
      - "127.0.0.1:19530:19530"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  # Embedding 服務（sentence-transformers、CPU float32；模型 google/embeddinggemma-2，文字與圖片共用）。
  # 只對本機 127.0.0.1:8002 開放（無驗證）；本機快速測試：docker compose up -d embedder
  # 有自己的模型快取 volume：vLLM 以 root 寫入 hf-cache，共用會有權限衝突
  embedder:
    build:
      context: ..
      dockerfile: docker/embedder.Dockerfile
    image: phoebe-embedder:local
    restart: unless-stopped
    # 不繼承整份 docker/.env（含 GEMINI_API_KEY 等）：只傳需要的變數
    environment:
      EMBED_MODEL_ID: ${EMBED_MODEL_ID:-google/embeddinggemma-2}
      EMBED_IMAGE_TOKENS: ${EMBED_IMAGE_TOKENS:-280}
      HF_HOME: /hf-cache
      # 選用：主機環境有設定時才傳入
      HF_TOKEN:
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - ./volumes/embedder-hf-cache:/hf-cache
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3)
      interval: 15s
      timeout: 5s
      retries: 10
      # 首次啟動要下載並載入模型（約 1.5 GB）
      start_period: 600s

  web:
    <<: *env
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: web
    image: phoebe-web:local
    restart: unless-stopped
    depends_on:
      milvus:
        condition: service_healthy
      embedder:
        condition: service_healthy
    stop_grace_period: 30s
    ports:
      - "${PHOEBE_PORT:-8000}:8000"
    environment:
      KB_INGEST_MODE: external
      MILVUS_URI: http://milvus:19530
      EMBEDDER_URL: http://embedder:8000
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      DB_PATH: /db/app.db
      KB_DIR: /data/kb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # SQLite（WAL，web 與 ingest 同時讀寫）放在 Docker 管理的 volume：
      # Windows 主機目錄經過檔案共享層，檔案鎖與共用記憶體不可靠
      - phoebe-db:/db
      - ./volumes/kb:/data/kb
    healthcheck:
      # /api/me 未登入回 401 也代表服務正常
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.error, urllib.request
          try:
              urllib.request.urlopen("http://127.0.0.1:8000/api/me", timeout=3)
          except urllib.error.HTTPError as e:
              sys.exit(0 if e.code == 401 else 1)
          except Exception:
              sys.exit(1)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  ingest:
    <<: *env
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: ingest
    image: phoebe-ingest:local
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      milvus:
        condition: service_healthy
      embedder:
        condition: service_healthy
      # 只等容器啟動：vLLM 還在下載模型或失敗時，LiteParse 仍可使用（OCR 解析器會顯示未啟動）
      # vllm 只在 lightonocr profile 啟用時存在；沒啟用就略過（required: false）
      vllm:
        condition: service_started
        required: false
    # 收到 SIGTERM 後，處理中的文件要等已送進 vLLM 的 OCR 頁面跑完才會停；
    # 一次 4 頁約 90 秒，30 秒會被 SIGKILL，文件得等過期重排。
    stop_grace_period: 120s
    environment:
      OCR_BACKEND: vllm
      VLLM_BASE_URL: http://vllm:8000/v1
      MILVUS_URI: http://milvus:19530
      EMBEDDER_URL: http://embedder:8000
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      DB_PATH: /db/app.db
      KB_DIR: /data/kb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - phoebe-db:/db
      - ./volumes/kb:/data/kb

  # LightOnOCR 官方的服務方式（vLLM）：GPU 專用於 OCR 模型。
  # 預設不啟動，需加 profile：docker compose --profile lightonocr up -d
  # 只想給本機快速測試用：docker compose --profile lightonocr up -d vllm（只對本機 127.0.0.1:8001 開放）
  # 不載入 env_file：vllm 不需要應用程式設定，避免 vLLM 對未知的 VLLM_* 環境變數發出警告
  vllm:
    image: vllm/vllm-openai:v0.30.0
    profiles: ["lightonocr"]
    restart: unless-stopped
    ports:
      # 無驗證的 GPU 端點，只對本機開放
      - "127.0.0.1:8001:8000"
    command:
      - --model
      - ${OCR_MODEL:-lightonai/LightOnOCR-3-0.8B}
      - --trust-remote-code
      - --limit-mm-per-prompt
      - '{"image": 1}'
      - --default-chat-template-kwargs
      - '{"enable_thinking": false}'
      - --mm-processor-cache-gb
      - "0"
      - --no-enable-prefix-caching
      # RTX 2060（Turing）不支援 bfloat16
      - --dtype
      - float16
      - --gpu-memory-utilization
      - ${OCR_VLLM_GPU_UTIL:-0.8}
      - --max-model-len
      - ${OCR_VLLM_MAX_MODEL_LEN:-18000}
      # 6GB 顯卡：CUDA graph 的額外記憶體會讓 KV cache 配不到空間，改用 eager 並限制同時序列數
      - --enforce-eager
      - --max-num-seqs
      - ${OCR_VLLM_MAX_NUM_SEQS:-4}
    ipc: host
    volumes:
      # vLLM 映像以 root 執行，Hugging Face 預設快取在 /root/.cache/huggingface
      - ./volumes/vllm-hf-cache:/root/.cache/huggingface
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3)
      interval: 15s
      timeout: 5s
      retries: 10
      # 首次啟動要下載並載入模型
      start_period: 600s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

# 除了 SQLite 之外，資料都放在 docker/volumes/ 下（主機目錄，已被 git 忽略）
volumes:
  phoebe-db:
